# ============================================================
#  Eclipse Mosquitto – Konfiguration
#  MQTT (TCP) auf Port 1883 + WebSocket auf Port 9001
# ============================================================

# --- Persistence -------------------------------------------
persistence true
persistence_location /mosquitto/data/

# --- Logging -----------------------------------------------
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Listener 1: Standard MQTT (TCP, Port 1883) ------------
listener 1883
protocol mqtt

# Authentifizierung: für lokale Entwicklung anonym erlauben
# Für Produktion: password_file aktivieren (s.u.)
allow_anonymous true

# Passwort-Datei (optional, auskommentiert):
# password_file /mosquitto/config/passwd

# --- Listener 2: MQTT über WebSocket (Port 9001) -----------
listener 9001
protocol websockets

allow_anonymous true

# Für HTTPS/WSS (TLS) optional aktivierbar:
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key

# --- Verbindungsoptionen -----------------------------------
max_connections 100
max_keepalive 120